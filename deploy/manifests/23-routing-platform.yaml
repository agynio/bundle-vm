# Platform UI/API routing (ported from bootstrap stacks/platform
# VirtualServices). UIs route /api and /socket.io to the gateway service and
# everything else to the app itself.
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: console-app
  namespace: istio-gateway
spec:
  hosts:
    - "console.{{BASE_DOMAIN}}"
  gateways:
    - platform-gateway
  http:
    - match:
        - uri:
            prefix: /api/
        - uri:
            exact: /api
      rewrite:
        uri: /
      route:
        - destination:
            host: gateway.platform.svc.cluster.local
            port:
              number: 8080
    - match:
        - uri:
            prefix: /socket.io
      route:
        - destination:
            host: gateway.platform.svc.cluster.local
            port:
              number: 8080
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: console-app.platform.svc.cluster.local
            port:
              number: 3000
