# The cluster admin the Gateway vouches for.
#
# CLUSTER_ADMIN_TOKEN lets the Gateway answer as a fixed identity without anyone
# signing in, which is what makes an unattended install usable. But nothing
# creates that identity: no OIDC login happens, so Users never provisions it and
# Identity never registers it. Everything that resolves an identity then fails
# on it -- reading a nickname, naming an agent, listing members -- while the
# Gateway keeps happily authenticating.
#
# architecture/users.md ("Bootstrap Flow", phase 1) provisions the first admin
# exactly this way: rows written straight into Users and Identity, then the
# OpenFGA tuple. apps-provision already writes the tuple; these are the two rows
# it cannot write, because it has no database client.
#
# Runs on the Postgres image for psql, and only needs the shared instance.
# Idempotent: ON CONFLICT DO NOTHING on both rows, so a restart is a no-op.
apiVersion: batch/v1
kind: Job
metadata:
  name: admin-identity-provision
  namespace: platform
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app: admin-identity-provision
    spec:
      restartPolicy: OnFailure
      containers:
        - name: provision
          image: postgres:16.6-alpine
          env:
            - name: PGPASSWORD
              value: agyn
            - name: ADMIN_IDENTITY
              value: a3c1e9d2-7f4b-5e1a-9c3d-2b8f6a4e7d10
          command: ["sh", "-c"]
          args:
            - |
              set -eu

              PSQL="psql -h platform-postgres.platform.svc -U agyn -v ON_ERROR_STOP=1"

              echo "[admin-identity] waiting for postgres"
              until ${PSQL} -d postgres -c 'select 1' >/dev/null 2>&1; do sleep 5; done

              # Both services own their own schema and create it on first start,
              # so this waits for them rather than assuming an order.
              echo "[admin-identity] waiting for the identities table"
              until ${PSQL} -d identity -c 'select 1 from identities limit 1' >/dev/null 2>&1; do sleep 5; done
              echo "[admin-identity] waiting for the users table"
              until ${PSQL} -d users -c 'select 1 from users limit 1' >/dev/null 2>&1; do sleep 5; done

              # 1 is IDENTITY_TYPE_USER. The admin is a user like any other; the
              # only difference is that a token stands in for its login.
              echo "[admin-identity] registering identity ${ADMIN_IDENTITY}"
              ${PSQL} -d identity -c "INSERT INTO identities (identity_id, identity_type)
                VALUES ('${ADMIN_IDENTITY}', 1) ON CONFLICT DO NOTHING"

              # oidc_subject is NOT NULL and unique. Nothing will ever present
              # this subject at the IdP, which is the point: the row exists to
              # be resolvable, not to be logged into.
              echo "[admin-identity] creating the admin user row"
              ${PSQL} -d users -c "INSERT INTO users
                (identity_id, oidc_subject, name, email, photo_url, nickname)
                VALUES ('${ADMIN_IDENTITY}', 'agyn-local-cluster-admin',
                        'Cluster Admin', 'admin@agyn.local', '', 'admin')
                ON CONFLICT DO NOTHING"

              echo "[admin-identity] done"
