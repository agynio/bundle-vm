# Operator-provided secrets the agyn-platform umbrella chart consumes. For the
# local image these are fixed dev values (never use outside a local VM).
#
# No database URLs here: the umbrella owns Postgres, so it renders one key per
# entry in postgres.databases -- including the runner's and the apps', now that
# they ship in the same release. A service added to the chart needs no change on
# this side.
#
# No object-storage credentials either: the umbrella deploys MinIO, so it writes
# that Secret from the same values the subchart is configured with. Writing it
# here as well left two copies to keep in step, and Helm refuses to adopt the
# one it did not create.

# secrets-encryption-key is deliberately absent: the agyn-platform chart creates
# it, and a Secret this file made first carries no Helm ownership metadata, so
# the install fails with "exists and cannot be imported into the current
# release". Same reason agyn-workloads is not in 00-namespaces.yaml.
---
# HMAC key the Terminal Proxy signs session tickets with. Shared across replicas
# so any of them can validate a ticket issued by another; must be at least 32
# bytes or the service refuses to start. A fixed dev value like the rest of this
# file — a real install generates one per deployment.
apiVersion: v1
kind: Secret
metadata:
  # Name and key are what the chart's secretKeyRef asks for; they are not free
  # choices. A mismatch leaves the pod stuck on a missing secret.
  name: terminal-proxy-ticket-signing
  namespace: agyn-platform
type: Opaque
stringData:
  signing-key: "dev-terminal-ticket-signing-key-32b!"
