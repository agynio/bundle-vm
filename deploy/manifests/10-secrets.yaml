# Operator-provided secrets the agyn-platform umbrella chart consumes. For the
# local image these are fixed dev values (never use outside a local VM).
#
# agyn-platform-database-urls: one DATABASE_URL per service, all pointing at the
# shared in-cluster Postgres (see 30-postgres.yaml), one database each.
apiVersion: v1
kind: Secret
metadata:
  name: agyn-platform-database-urls
  namespace: platform
type: Opaque
stringData:
  agents: postgresql://agyn:agyn@platform-postgres.platform.svc:5432/agents?sslmode=disable
  apps: postgresql://agyn:agyn@platform-postgres.platform.svc:5432/apps?sslmode=disable
  chat: postgresql://agyn:agyn@platform-postgres.platform.svc:5432/chat?sslmode=disable
  egress: postgresql://agyn:agyn@platform-postgres.platform.svc:5432/egress?sslmode=disable
  ziti-management: postgresql://agyn:agyn@platform-postgres.platform.svc:5432/ziti_management?sslmode=disable
  expose: postgresql://agyn:agyn@platform-postgres.platform.svc:5432/expose?sslmode=disable
  files: postgresql://agyn:agyn@platform-postgres.platform.svc:5432/files?sslmode=disable
  groups: postgresql://agyn:agyn@platform-postgres.platform.svc:5432/groups?sslmode=disable
  identity: postgresql://agyn:agyn@platform-postgres.platform.svc:5432/identity?sslmode=disable
  llm: postgresql://agyn:agyn@platform-postgres.platform.svc:5432/llm?sslmode=disable
  networks: postgresql://agyn:agyn@platform-postgres.platform.svc:5432/networks?sslmode=disable
  organizations: postgresql://agyn:agyn@platform-postgres.platform.svc:5432/organizations?sslmode=disable
  runners: postgresql://agyn:agyn@platform-postgres.platform.svc:5432/runners?sslmode=disable
  secrets: postgresql://agyn:agyn@platform-postgres.platform.svc:5432/secrets?sslmode=disable
  threads: postgresql://agyn:agyn@platform-postgres.platform.svc:5432/threads?sslmode=disable
  tracing: postgresql://agyn:agyn@platform-postgres.platform.svc:5432/tracing?sslmode=disable
  users: postgresql://agyn:agyn@platform-postgres.platform.svc:5432/users?sslmode=disable
---
apiVersion: v1
kind: Secret
metadata:
  name: agyn-files-s3
  namespace: platform
type: Opaque
stringData:
  access-key: minioadmin
  secret-key: minioadmin
---
# Symmetric encryption key for the Secrets service (bootstrap dev default).
apiVersion: v1
kind: Secret
metadata:
  name: secrets-encryption-key
  namespace: platform
type: Opaque
stringData:
  encryptionKey: "dev-encryption-key-32bytes!!@#$%"
---
# HMAC key the Terminal Proxy signs session tickets with. Shared across replicas
# so any of them can validate a ticket issued by another; must be at least 32
# bytes or the service refuses to start. A fixed dev value like the rest of this
# file — a real install generates one per deployment.
apiVersion: v1
kind: Secret
metadata:
  name: terminal-proxy-ticket-signing-key
  namespace: platform
type: Opaque
stringData:
  signingKey: "dev-terminal-ticket-signing-key-32b!"
