# In-cluster DNS rewrites (k3s coredns imports /etc/coredns/custom/*.override).
# The Ziti controller bakes ziti.<domain> into enrollment JWTs; router pods and
# SDK clients must resolve these names in-cluster (public DNS resolves them to
# 127.0.0.1). Ported from bootstrap stacks/deps coredns_ziti_rewrites.
#
# The OIDC issuer needs the same treatment, but the keycloak chart adds that
# rewrite itself -- this file is applied once at bake time and never again, so a
# hostname added here would never reach a VM that is already running.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  agyn.override: |
    rewrite name ziti.{{BASE_DOMAIN}} ziti-controller-client.ziti.svc.cluster.local
    rewrite name ziti-mgmt.{{BASE_DOMAIN}} ziti-controller-mgmt.ziti.svc.cluster.local
    rewrite name ziti-router.{{BASE_DOMAIN}} ziti-router-edge.ziti.svc.cluster.local
    rewrite name chat.{{BASE_DOMAIN}} istio-ingressgateway.istio-gateway.svc.cluster.local
    rewrite name tracing.{{BASE_DOMAIN}} istio-ingressgateway.istio-gateway.svc.cluster.local
    rewrite name console.{{BASE_DOMAIN}} istio-ingressgateway.istio-gateway.svc.cluster.local
