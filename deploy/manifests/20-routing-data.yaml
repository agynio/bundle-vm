---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: openfga-playground
  namespace: istio-gateway
spec:
  hosts:
    - "openfga-playground.{{BASE_DOMAIN}}"
  gateways:
    - platform-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: openfga.openfga.svc.cluster.local
            port:
              number: 3000
