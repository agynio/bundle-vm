apiVersion: v1
kind: Namespace
metadata:
  name: ziti
---
# Local/dev admin credentials for the OpenZiti controller (bootstrap generates a
# random password; the image uses a fixed local-only credential).
apiVersion: v1
kind: Secret
metadata:
  name: ziti-controller-admin
  namespace: ziti
type: Opaque
stringData:
  admin-user: admin
  admin-password: agyn-local-admin
