# Shared in-cluster Postgres for the platform (external-DB mode of the umbrella
# chart). Local/dev only: a single instance with one database per service and a
# single dev credential (agyn/agyn). Production uses a managed Postgres and the
# operator-provided agyn-platform-database-urls secret instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-postgres-init
  namespace: platform
data:
  init.sql: |
    CREATE DATABASE agents;
    CREATE DATABASE reminders;
    CREATE DATABASE telegram_connector;
    CREATE DATABASE apps;
    CREATE DATABASE chat;
    CREATE DATABASE egress;
    CREATE DATABASE ziti_management;
    CREATE DATABASE expose;
    CREATE DATABASE files;
    CREATE DATABASE groups;
    CREATE DATABASE identity;
    CREATE DATABASE networks;
    CREATE DATABASE llm;
    CREATE DATABASE metering;
    CREATE DATABASE organizations;
    CREATE DATABASE runners;
    CREATE DATABASE secrets;
    CREATE DATABASE threads;
    CREATE DATABASE tracing;
    CREATE DATABASE users;
---
apiVersion: v1
kind: Service
metadata:
  name: platform-postgres
  namespace: platform
spec:
  selector:
    app: platform-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: platform-postgres
  namespace: platform
spec:
  serviceName: platform-postgres
  replicas: 1
  selector:
    matchLabels:
      app: platform-postgres
  template:
    metadata:
      labels:
        app: platform-postgres
    spec:
      containers:
        - name: postgres
          # Same tag the postgres-helm chart (openfga-db) uses, so both share
          # base layers instead of shipping two Postgres images in the bake.
          image: postgres:16.6-alpine
          env:
            - name: POSTGRES_USER
              value: agyn
            - name: POSTGRES_PASSWORD
              value: agyn
            - name: POSTGRES_DB
              value: agyn
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          # Without requests the database is BestEffort, which makes the
          # stateful tier the first thing evicted under memory pressure.
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "agyn"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: init
          configMap:
            name: platform-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
