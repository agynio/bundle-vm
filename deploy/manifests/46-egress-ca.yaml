# CA keypair used by the agents-orchestrator / egress path (bootstrap generates
# this in Terraform; here cert-manager issues it from the self-signed
# ClusterIssuer provided by the base image).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: egress-ca
  namespace: platform
spec:
  isCA: true
  commonName: Agyn Egress CA
  secretName: egress-ca
  duration: 87600h
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
