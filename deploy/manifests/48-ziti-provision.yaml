# One-shot provisioning of the OpenZiti fabric (ported from bootstrap
# stacks/ziti, which uses the Terraform ziti provider). A single container with
# the ziti CLI creates the edge router, identities, services, intercept configs,
# and policies, then stores the enrollment JWTs as the Kubernetes secrets the
# router chart and platform expect (via the API with curl; the controller image
# ships curl + jq). Idempotent: pending enrollment JWTs are recovered from the
# controller, so re-runs and container restarts are safe.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ziti-provision
  namespace: ziti
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ziti-provision-secrets
  namespace: ziti
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ziti-provision-secrets
  namespace: platform
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ziti-provision-secrets
  namespace: ziti
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ziti-provision-secrets
subjects:
  - kind: ServiceAccount
    name: ziti-provision
    namespace: ziti
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ziti-provision-secrets
  namespace: platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ziti-provision-secrets
subjects:
  - kind: ServiceAccount
    name: ziti-provision
    namespace: ziti
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ziti-provision-script
  namespace: ziti
data:
  provision.sh: |
    #!/bin/sh
    set -eu
    export HOME=/tmp

    K8S=https://kubernetes.default.svc
    SA=/var/run/secrets/kubernetes.io/serviceaccount
    TOKEN="$(cat "$SA/token")"

    k8s() { # method path [json]
      method="$1"; path="$2"; body="${3:-}"
      if [ -n "$body" ]; then
        curl -sS --cacert "$SA/ca.crt" -H "Authorization: Bearer $TOKEN" \
          -H 'Content-Type: application/json' -X "$method" \
          -o /dev/null -w '%{http_code}' -d "$body" "$K8S$path"
      else
        curl -sS --cacert "$SA/ca.crt" -H "Authorization: Bearer $TOKEN" \
          -X "$method" -o /dev/null -w '%{http_code}' "$K8S$path"
      fi
    }

    secret_exists() { # namespace name
      [ "$(k8s GET "/api/v1/namespaces/$1/secrets/$2")" = "200" ]
    }

    # Some charts mount an *enrolled* identity rather than a JWT: the pod has no
    # way to enroll itself, so the identity.json has to exist before it starts.
    # `ziti edge enroll` consumes the one-time token, which is why this stores
    # the result — a second enrolment of the same JWT is not possible.
    store_identity() { # namespace name identity-json
      body="$(jq -n --arg name "$2" --arg identity "$3" \
        '{apiVersion:"v1",kind:"Secret",metadata:{name:$name},type:"Opaque",stringData:{"identity.json":$identity}}')"
      code="$(k8s POST "/api/v1/namespaces/$1/secrets" "$body")"
      case "$code" in
      201 | 409) echo "[ziti-provision] identity secret $1/$2: $code" ;;
      *)
        echo "[ziti-provision] failed to create identity secret $1/$2: HTTP $code" >&2
        return 1
        ;;
      esac
    }

    store_secret() { # namespace name jwt
      body="$(jq -n --arg name "$2" --arg jwt "$3" \
        '{apiVersion:"v1",kind:"Secret",metadata:{name:$name},type:"Opaque",stringData:{enrollmentJwt:$jwt}}')"
      code="$(k8s POST "/api/v1/namespaces/$1/secrets" "$body")"
      case "$code" in
      201 | 409) echo "[ziti-provision] secret $1/$2: $code" ;;
      *)
        echo "[ziti-provision] failed to create secret $1/$2: HTTP $code" >&2
        return 1
        ;;
      esac
    }

    echo "[ziti-provision] waiting for management API"
    i=0
    until ziti edge login "https://ziti-mgmt.{{BASE_DOMAIN}}:{{INGRESS_PORT}}/edge/management/v1" \
        -u "$ZITI_ADMIN_USER" -p "$ZITI_ADMIN_PASSWORD" -y >/dev/null 2>&1; do
      i=$((i + 1))
      [ "$i" -gt 120 ] && echo "management API never became ready" >&2 && exit 1
      sleep 5
    done
    echo "[ziti-provision] logged in"

    exists() { # type name
      ziti edge list "$1" "name=\"$2\"" -j | jq -e --arg n "$2" '.data[] | select(.name == $n)' >/dev/null
    }

    # Edge router; its (pending) enrollment JWT lands in ziti-router-enrollment.
    exists edge-routers edge-router-1 || \
      ziti edge create edge-router edge-router-1 --role-attributes public,all
    if ! secret_exists ziti ziti-router-enrollment; then
      jwt="$(ziti edge list edge-routers 'name="edge-router-1"' -j | jq -r '.data[0].enrollmentJwt // empty')"
      if [ -n "$jwt" ]; then
        store_secret ziti ziti-router-enrollment "$jwt"
      else
        echo "[ziti-provision] router already enrolled; no JWT to store"
      fi
    fi

    # Identities (bootstrap parity). ziti-management is the only admin; its JWT
    # is consumed by the platform's ziti-management self-enrollment.
    ensure_identity() { # name secret-namespace secret-name extra-args...
      name="$1"; secret_ns="$2"; secret_name="$3"
      shift 3
      exists identities "$name" || ziti edge create identity "$name" "$@"
      secret_exists "$secret_ns" "$secret_name" && return 0
      jwt="$(ziti edge list identities "name=\"$name\"" -j | jq -r '.data[0].enrollment.ott.jwt // empty')"
      if [ -n "$jwt" ]; then
        store_secret "$secret_ns" "$secret_name" "$jwt"
      else
        echo "[ziti-provision] identity $name already enrolled; no JWT to store"
      fi
    }

    ensure_identity ziti-management platform ziti-management-enrollment --admin
    ensure_identity gateway ziti ziti-gateway-enrollment --role-attributes gateway-hosts
    ensure_identity orchestrator ziti ziti-orchestrator-enrollment --role-attributes orchestrators
    ensure_identity egress-gateway ziti ziti-egress-gateway-enrollment --role-attributes egress-gateway-hosts

    # Identities whose consumer mounts an enrolled identity.json instead of
    # enrolling for itself: the egress gateway, and each first-party app.
    ensure_enrolled_identity() { # name secret-namespace secret-name extra-args...
      name="$1"; secret_ns="$2"; secret_name="$3"
      shift 3
      exists identities "$name" || ziti edge create identity "$name" "$@"
      secret_exists "$secret_ns" "$secret_name" && return 0
      jwt="$(ziti edge list identities "name=\"$name\"" -j | jq -r '.data[0].enrollment.ott.jwt // empty')"
      if [ -z "$jwt" ]; then
        echo "[ziti-provision] identity $name already enrolled but no secret holds it" >&2
        return 1
      fi
      printf '%s' "$jwt" >"/tmp/$name.jwt"
      ziti edge enroll --jwt "/tmp/$name.jwt" --out "/tmp/$name.json" >/dev/null
      store_identity "$secret_ns" "$secret_name" "$(cat "/tmp/$name.json")"
      rm -f "/tmp/$name.jwt" "/tmp/$name.json"
    }

    ensure_enrolled_identity egress-gateway-host platform egress-gateway-ziti-identity \
      --role-attributes egress-gateway-hosts
    ensure_enrolled_identity app-reminders platform reminders-ziti-identity \
      --role-attributes app-hosts
    ensure_enrolled_identity app-telegram platform telegram-connector-ziti-identity \
      --role-attributes app-hosts

    # Intercept configs + services.
    exists configs gateway-intercept-v1 || \
      ziti edge create config gateway-intercept-v1 intercept.v1 \
        '{"addresses":["gateway.ziti"],"protocols":["tcp"],"portRanges":[{"low":443,"high":443}]}'
    exists configs llm-proxy-intercept-v1 || \
      ziti edge create config llm-proxy-intercept-v1 intercept.v1 \
        '{"addresses":["llm-proxy.ziti"],"protocols":["tcp"],"portRanges":[{"low":80,"high":80}]}'
    exists configs tracing-intercept-v1 || \
      ziti edge create config tracing-intercept-v1 intercept.v1 \
        '{"addresses":["tracing.ziti"],"protocols":["tcp"],"portRanges":[{"low":443,"high":443}]}'
    exists services gateway || \
      ziti edge create service gateway --configs gateway-intercept-v1 --role-attributes gateway
    exists services llm-proxy || \
      ziti edge create service llm-proxy --configs llm-proxy-intercept-v1 --role-attributes llm-proxy
    exists services tracing || \
      ziti edge create service tracing --configs tracing-intercept-v1 --role-attributes tracing

    # Vendors were renamed after the APIs they open (claude -> anthropic,
    # codex -> openai). A cluster provisioned under the old names holds
    # services, policies, and role attributes that no longer match anything:
    # a workload keeps its llm-native-claude attribute, the policy granting it
    # is gone, and its vendor traffic silently stops being intercepted. That
    # reads as a network fault rather than as a rename, so the old objects are
    # removed here before the new ones are created.
    #
    # Role attributes on live identities are the orchestrator's to restamp --
    # it does so on the next assembly -- but the stale grant must not outlive
    # the rename, or an unmigrated workload keeps reaching a service it should
    # no longer match.
    for old in native-claude-dial native-codex-dial; do
      exists service-policies "$old" && ziti edge delete service-policy "$old" || true
    done
    for old in llm-intercept-claude llm-intercept-codex; do
      exists services "$old" && ziti edge delete service "$old" || true
    done
    for old in llm-intercept-claude-intercept-v1 llm-intercept-codex-intercept-v1; do
      exists configs "$old" && ziti edge delete config "$old" || true
    done

    # Vendor intercept services, one per vendor. Static, not per-rule: the
    # vendor set is closed, so nothing is provisioned per organization,
    # environment, or attachment. What varies per workload is only which of
    # these it may dial, expressed by the llm-native-<vendor> role attribute
    # the orchestrator stamps on the workload identity. No host.v1 -- the
    # proxy binds these through the SDK exactly as it binds llm-proxy.
    exists configs llm-intercept-anthropic-intercept-v1 || \
      ziti edge create config llm-intercept-anthropic-intercept-v1 intercept.v1 \
        '{"addresses":["api.anthropic.com"],"protocols":["tcp"],"portRanges":[{"low":443,"high":443}]}'
    exists configs llm-intercept-openai-intercept-v1 || \
      ziti edge create config llm-intercept-openai-intercept-v1 intercept.v1 \
        '{"addresses":["chatgpt.com"],"protocols":["tcp"],"portRanges":[{"low":443,"high":443}]}'
    exists services llm-intercept-anthropic || \
      ziti edge create service llm-intercept-anthropic \
        --configs llm-intercept-anthropic-intercept-v1 --role-attributes llm-intercept-services
    exists services llm-intercept-openai || \
      ziti edge create service llm-intercept-openai \
        --configs llm-intercept-openai-intercept-v1 --role-attributes llm-intercept-services

    # Service policies (bootstrap stacks/ziti parity).
    sp() { # name type identity-roles service-roles
      exists service-policies "$1" || \
        ziti edge create service-policy "$1" "$2" --identity-roles "$3" --service-roles "$4"
    }
    sp agents-dial-gateway Dial '#agents' '@gateway'
    sp orchestrators-dial-runners Dial '#orchestrators' '#runner-services'
    sp terminal-proxy-dial-runners Dial '#terminal-proxy-hosts' '#runner-services'
    sp gateway-bind Bind '#gateway-hosts' '@gateway'
    sp llm-proxy-bind Bind '#llm-proxy-hosts' '@llm-proxy'
    sp egress-gateway-bind Bind '#egress-gateway-hosts' '#egress-services'
    sp agents-dial-llm-proxy Dial '#agents' '@llm-proxy'
    sp llm-proxy-bind-intercept Bind '#llm-proxy-hosts' '#llm-intercept-services'
    # A workload in platform mode carries neither attribute, so its vendor
    # traffic is not intercepted at all -- it leaves the pod as any unmatched
    # destination does.
    sp native-anthropic-dial Dial '#llm-native-anthropic' '@llm-intercept-anthropic'
    sp native-openai-dial Dial '#llm-native-openai' '@llm-intercept-openai'
    sp tracing-bind Bind '#tracing-hosts' '@tracing'
    sp agents-dial-tracing Dial '#agents' '@tracing'
    sp runners-bind Bind '#runners' '#runner-services'
    sp apps-dial-gateway Dial '#apps' '@gateway'
    sp apps-bind Bind '#apps' '#app-services'
    sp gateway-dial-apps Dial '#gateway-hosts' '#app-services'
    sp runners-service-dial-runners Dial '#runners-service-hosts' '#runner-services'

    exists edge-router-policies all-identities-all-routers || \
      ziti edge create edge-router-policy all-identities-all-routers \
        --identity-roles '#all' --edge-router-roles '#all'
    exists service-edge-router-policies all-services-all-routers || \
      ziti edge create service-edge-router-policy all-services-all-routers \
        --service-roles '#all' --edge-router-roles '#all'

    echo "[ziti-provision] fabric provisioned and secrets stored"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ziti-provision
  namespace: ziti
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: ziti-provision
    spec:
      serviceAccountName: ziti-provision
      restartPolicy: OnFailure
      containers:
        - name: provision
          # Same image as the deployed controller (guaranteed present, ships
          # the matching ziti CLI plus curl and jq).
          image: openziti/ziti-controller:2.0.0-pre10
          command: ["/bin/sh", "/scripts/provision.sh"]
          env:
            - name: ZITI_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: ziti-controller-admin
                  key: admin-user
            - name: ZITI_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ziti-controller-admin
                  key: admin-password
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: ziti-provision-script
            defaultMode: 0o755
