# The entire Agyn platform as ONE helm release, from the unified agyn-platform
# umbrella chart (oci://ghcr.io/agynio/charts/agyn-platform).
#
# Values are a local port of the canonical contract file
# infrastructure/terraform/components/platform/values/agyn-platform.yaml.tftpl.
# Local substitutions: in-cluster MinIO for S3, in-cluster OpenFGA, the
# umbrella's bundled Keycloak as the OIDC issuer.

# The chart's lookup-based secret contract check requires cluster access at
# render time; secrets are consumed at runtime via secretKeyRef.

# The umbrella owns Postgres: one chart installs the platform, so a database a
# service needs is created by the same release that adds the service.
postgres:
  enabled: true
  persistence:
    size: 20Gi
  # The workload layer's own databases, created by the same release that adds
  # the workloads.
  databases:
    reminders: reminders
    telegram-connector: telegram_connector

validation:
  requireExistingSecrets: false

# Umbrella-level contract values. The endpoint is the chart's own bundled MinIO,
# reached in the release namespace -- not a copy installed beside it.
s3:
  existingSecret: agyn-files-s3
  endpoint: minio:9000
  bucket: agyn-files
  region: us-east-1
  useSSL: false
  forcePathStyle: true

# openfga, minio and nats are on by default in the chart now, and openfga-db was
# never one of its dependencies -- the block enabled nothing.

# OIDC: the umbrella's bundled Keycloak, reached on the same host:port the
# browser uses. coredns-custom points auth.{{BASE_DOMAIN}} at the ingress and
# install-ingress.sh gives that Service the host port, so this one URL resolves
# from the browser and from inside the cluster. It has to be one URL: the
# Gateway fetches discovery server-side and zitadel/oidc refuses a document
# whose issuer differs from the URL it was fetched from.
platform:
  oidc:
    issuerUrl: https://auth.{{BASE_DOMAIN}}:{{INGRESS_HOST_PORT}}/realms/agyn
    clientId: agyn-chat
    audience: ""
  externalUrls:
    # Single source of truth: the Gateway hands this to clients when it issues
    # a ticket, the platform configmap publishes it, and the Terminal Proxy is
    # wired from the same value. Left unset, the chart default would ship the
    # example.com placeholder and every client would dial a host that is not
    # this VM.
    terminalProxyWebSocket: wss://terminal.{{BASE_DOMAIN}}:{{INGRESS_HOST_PORT}}/terminal

# The bundled OIDC provider. externalUrl is the issuer above; the app origins
# become the redirect URIs of one client per app.
#
# The realm is imported only when it does not already exist — Keycloak's
# --import-realm is create-once and the strategy cannot be overridden — so
# editing this reaches an existing VM only after the keycloak database is
# dropped, or through the Admin API.
keycloak:
  enabled: true
  externalUrl: https://auth.{{BASE_DOMAIN}}:{{INGRESS_HOST_PORT}}
  # The chart owns its own routing and cluster wiring. It has to: the bake wipes
  # deploy/ from the VM, so anything left in a manifest here is applied once at
  # build time and never again -- an upgrade would bring Keycloak up with no
  # route to it, no DNS for the issuer and no CA for the services verifying
  # tokens against it.
  routing:
    enabled: true
    host: auth.{{BASE_DOMAIN}}
  wiring:
    enabled: true
    caBundle:
      enabled: true
    corednsRewrite:
      enabled: true
    ingressHostPort:
      enabled: true
      port: {{INGRESS_HOST_PORT}}
    gatewayHost:
      enabled: true
  appOrigins:
    console: https://console.{{BASE_DOMAIN}}:{{INGRESS_HOST_PORT}}
    chat: https://chat.{{BASE_DOMAIN}}:{{INGRESS_HOST_PORT}}
    tracing: https://tracing.{{BASE_DOMAIN}}:{{INGRESS_HOST_PORT}}
    sandboxes: https://sandboxes.{{BASE_DOMAIN}}:{{INGRESS_HOST_PORT}}

gateway:
  # One replica: this is a single-node VM, so a second buys no failover — it
  # only competes for the same CPU and memory. Production installs keep the
  # chart default, where leader election and spare capacity are real.
  replicaCount: 1
  gateway:
    oidcIssuerUrl: https://auth.{{BASE_DOMAIN}}:{{INGRESS_HOST_PORT}}/realms/agyn
    oidcClientId: agyn-chat
    oidcAudience: ""
    # The bootstrap token and the identity it resolves to come from
    # platform.bootstrapToken in the umbrella: the chart generates one per
    # install into a Secret and the Gateway reads it by reference. A token baked
    # into the image would be identical on every machine running that version
    # and could not be rotated, so scripts/set-bootstrap-token.sh replaces the
    # Secret's value on first boot with one the host generated.
  # Agents dial the gateway over the OpenZiti overlay (gateway.ziti:443), so the
  # gateway must accept Ziti connections. Without it the overlay dial is reset:
  # "error reading server preface: ... connection reset by peer".
  # extraEnvVars is additive; `env` would replace the chart's templated list.
  extraEnvVars:
    - name: ZITI_ENABLED
      value: "true"
    # The issuer is served by the ingress under the local CA, and discovery,
    # JWKS and userinfo are all fetched from here. SSL_CERT_DIR is additive, so
    # the system roots survive; SSL_CERT_FILE would replace them and break
    # outbound TLS to the LLM providers.
    - name: SSL_CERT_DIR
      value: /etc/ssl/certs:/etc/agyn-ca
  extraVolumeMounts:
    - name: agyn-local-ca
      mountPath: /etc/agyn-ca
      readOnly: true
  extraVolumes:
    - name: agyn-local-ca
      configMap:
        # Copied out of the istio-gateway namespace by install-platform.sh.
        name: agyn-local-ca

# OpenZiti must be switched on explicitly — ZITI_ENABLED defaults to false in
# these charts, and bootstrap (stacks/platform) sets it to "true". Without it
# the orchestrator builds no ziti-management client, so createIdentity()
# returns nil silently: agent workloads get no OpenZiti identity and no tunnel
# sidecar, then die with "name resolver error: produced zero addresses" trying
# to reach gateway.ziti.
#
# NOTE: `env` REPLACES a subchart's default list (documented in the umbrella
# chart's own values.yaml), and the umbrella already replaces the
# agents-orchestrator list with three entries — dropping every Ziti/agent
# address the subchart shipped. The full list is restored here.
agents-orchestrator:
  # One replica: this is a single-node VM, so a second buys no failover — it
  # only competes for the same CPU and memory. Production installs keep the
  # chart default, where leader election and spare capacity are real.
  replicaCount: 1
  # Only what this VM alone knows. Everything else -- the overlay switch, the
  # service addresses, the ziti controller host and port, the workload init
  # images -- is a chart default now, and restating them here is what let
  # agynd-cli-init drift to 0.14.41 behind the 0.16.0 the chart ships and
  # dropped SANDBOX_INIT_IMAGE and seven others from the deployment entirely.
  #
  # extraEnvVars is additive, and none of these three is in the chart's own env,
  # so nothing is duplicated and nothing is reordered on upgrade.
  extraEnvVars:
    # k3s serves cluster DNS here. The sidecar rewrites the workload's
    # resolv.conf to this single upstream, and left empty the workload resolves
    # only intercepted names -- which glibc survives by falling through and a
    # c-ares client (Node) does not.
    - name: WORKLOAD_DNS_UPSTREAM
      value: "10.43.0.10"
    - name: ZITI_ENROLLMENT_DNS_UPSTREAM
      value: "10.43.0.10"
    - name: AGENT_LLM_BASE_URL
      value: "http://llm-proxy.ziti/v1"
    # The chart derives this from global.ingress.baseDomain, which cannot be set
    # until the service charts are released against service-base 0.1.5 -- 19 of
    # them still embed 0.1.4, whose schema rejects an unknown global. Empty
    # disables every catalog image reference rather than falling back, so it is
    # named here until then.
    - name: IMAGE_PROXY_HOST
      value: "registry.{{BASE_DOMAIN}}"

# Shell access to sandboxes. The CLI connects from the host, so the WebSocket
# URL it is handed carries the forwarded host port, not the in-cluster one
# (set-ingress-port.sh rewrites it when the host picks a different port).
terminal-proxy:
  enabled: true
  # One replica: this is a single-node VM, so a second buys no failover — it
  # only competes for the same CPU and memory. Production installs keep the
  # chart default, where leader election and spare capacity are real.
  replicaCount: 1
  terminalProxy:
    # Repeats platform.externalUrls.terminalProxyWebSocket above. The umbrella
    # defaults this from a YAML anchor, and anchors resolve when the chart's own
    # values are parsed — an override here does not flow into it. The chart
    # fails the render if the two disagree, which is what keeps the URL the
    # Gateway advertises and the one this service serves in step.
    websocketUrl: wss://terminal.{{BASE_DOMAIN}}:{{INGRESS_HOST_PORT}}/terminal
    # The overlay is the only path that reaches a runner in another network,
    # which is what runners generally are. Keeping the VM on it means the path
    # this ships with is the path that gets exercised, rather than a direct
    # dial that happens to work only because this VM's single runner is local.
    # The identity is requested per pod from Ziti Management and lease-renewed,
    # per openziti.md#service-identity-self-enrollment.
    ziti:
      enabled: true

# llm-proxy exposes a proper toggle rather than a raw env entry.
llm-proxy:
  # One replica: this is a single-node VM, so a second buys no failover — it
  # only competes for the same CPU and memory. Production installs keep the
  # chart default, where leader election and spare capacity are real.
  replicaCount: 1
  llmProxy:
    zitiEnabled: true

# Agents send spans to tracing.ziti:443 over the overlay.
tracing:
  replicaCount: 1
  extraEnvVars:
    - name: ZITI_ENABLED
      value: "true"

console-app:
  replicaCount: 1
  oidcAuthority: https://auth.{{BASE_DOMAIN}}:{{INGRESS_HOST_PORT}}/realms/agyn
  oidcClientId: agyn-console
  oidcResource: ""

chat-app:
  replicaCount: 1
  oidcAuthority: https://auth.{{BASE_DOMAIN}}:{{INGRESS_HOST_PORT}}/realms/agyn
  oidcClientId: agyn-chat
  oidcResource: ""
  origin: https://chat.{{BASE_DOMAIN}}:{{INGRESS_HOST_PORT}}
  mediaProxyUrl: https://media.{{BASE_DOMAIN}}:{{INGRESS_HOST_PORT}}

tracing-app:
  replicaCount: 1
  oidcAuthority: https://auth.{{BASE_DOMAIN}}:{{INGRESS_HOST_PORT}}/realms/agyn
  oidcClientId: agyn-tracing
  oidcResource: ""

sandboxes-app:
  replicaCount: 1
  oidcAuthority: https://auth.{{BASE_DOMAIN}}:{{INGRESS_HOST_PORT}}/realms/agyn
  oidcClientId: agyn-sandboxes
  oidcResource: ""

media-proxy:
  replicaCount: 1
  mediaProxy:
    oidcIssuerUrl: https://auth.{{BASE_DOMAIN}}:{{INGRESS_HOST_PORT}}/realms/agyn
    oidcClientId: agyn-chat
    oidcAudience: ""
    corsAllowedOrigin: https://chat.{{BASE_DOMAIN}}:{{INGRESS_HOST_PORT}}
  # Verifies tokens itself, so it fetches discovery from the issuer the same way
  # the Gateway does and needs the same local CA.
  extraEnvVars:
    - name: SSL_CERT_DIR
      value: /etc/ssl/certs:/etc/agyn-ca
  extraVolumeMounts:
    - name: agyn-local-ca
      mountPath: /etc/agyn-ca
      readOnly: true
  extraVolumes:
    - name: agyn-local-ca
      configMap:
        name: agyn-local-ca

# bitnami redis: pin by digest (the chart defaults to tag "latest"; bitnami no
# longer publishes versioned free tags) and disable auth (NOAUTH errors
# otherwise). NOTE: these two used to live in separate blocks and the second
# silently overrode the first — keep them merged.
notifications-redis:
  # Read replicas buy nothing on one node; the primary still serves.
  replica:
    replicaCount: 1
  image:
    digest: sha256:341edafd5622a1e47e4b3ab379913de84ea4a50d534f40aaa903a3825e0e1cf1
  auth:
    enabled: false

authorization:
  replicaCount: 1

files:
  replicaCount: 1
  securityContext:
    runAsUser: 65532
    runAsGroup: 65532
  files:
    s3:
      endpoint: minio:9000
      bucket: agyn-files
      region: us-east-1
      useSSL: false

# OpenZiti-backed services. ziti-management self-enrolls with the JWT from the
# ziti-management-enrollment secret (ziti-provision Job); runners/orchestrator/
# gateway then self-enroll via ziti-management.
# The image tag override this used to carry is gone: it named 0.10.17, and the
# umbrella now pins 0.10.19, so the override held the image behind its chart.
# terminal-proxy asks for the Terminal Proxy service type, which 0.10.17 does
# not know, and exits on startup with "unknown service type 8".
ziti-management:
  replicaCount: 1
  zitiControllerUrl: https://ziti-mgmt.{{BASE_DOMAIN}}:{{INGRESS_PORT}}/edge/management/v1

# groups is a core dependency: users/apps/agents do group-sync against it, and
# without it create-user/agent block ~30s on a downstream timeout. Needs its
# database (shared Postgres + db-urls secret) and an arm64 image (upstream only
# publishes amd64 — see the multi-arch note in the README).
groups:
  replicaCount: 1
# The Gateway serves the Networks API unconditionally, so leaving this off
# does not hide the feature — it makes every ListNetworks call fail with
# "produced zero addresses" once the console asks for it. ListServicesByTag,
# the API this needs, ships in the pinned ziti-management.
networks:
  replicaCount: 1
# On, like every other platform service the Gateway routes to. Its database is
# already provisioned in the shared Postgres and named in the db-urls secret.
expose:
  replicaCount: 1
  enabled: true
agents:
  replicaCount: 1

