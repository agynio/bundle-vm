# The entire Agyn platform as ONE helm release, from the unified agyn-platform
# umbrella chart (oci://ghcr.io/agynio/charts/agyn-platform).
#
# Values are a local port of the canonical contract file
# infrastructure/terraform/components/platform/values/agyn-platform.yaml.tftpl.
# Local substitutions: in-cluster MinIO for S3, in-cluster OpenFGA, bootstrap
# mockauth.dev dev OIDC issuer.

# The chart's lookup-based secret contract check requires cluster access at
# render time; secrets are consumed at runtime via secretKeyRef.

# The umbrella owns Postgres: one chart installs the platform, so a database a
# service needs is created by the same release that adds the service.
postgres:
  enabled: true
  persistence:
    size: 20Gi
  # The apps layer's own databases. Declared here because the umbrella creates
  # every database on this VM, and the apps chart has no postgres of its own.
  databases:
    reminders: reminders
    telegram-connector: telegram_connector

validation:
  requireExistingSecrets: false

# Umbrella-level contract values.
s3:
  existingSecret: agyn-files-s3
  endpoint: minio.minio.svc.cluster.local:9000
  bucket: agyn-files
  region: us-east-1
  useSSL: false
  forcePathStyle: true

# install-platform.sh installs openfga and minio itself, so the umbrella must
# not deploy a second copy. It gained them as optional subcharts in 0.6.0 (they
# are absent from 0.5.x), both defaulting on. metering is deliberately not here
# — the umbrella owns it now.
openfga:
  enabled: false
minio:
  enabled: false

# OIDC (bootstrap dev defaults: public mockauth.dev mock issuer).
platform:
  # Connection details for the separately installed instance above. These
  # belong here, not under openfga.*: that key configures the upstream OpenFGA
  # chart, whose schema rejects unknown properties and fails the render.
  openfga:
    apiUrl: http://openfga.openfga.svc.cluster.local:8080
    storeId: ""
    modelId: ""
  oidc:
    issuerUrl: https://mockauth.dev/r/301ebb13-15a8-48f4-baac-e3fa25be29fc/oidc
    clientId: client_MU95KU3gHQf5Ir7p
    audience: ""
  externalUrls:
    # Single source of truth: the Gateway hands this to clients when it issues
    # a ticket, the platform configmap publishes it, and the Terminal Proxy is
    # wired from the same value. Left unset, the chart default would ship the
    # example.com placeholder and every client would dial a host that is not
    # this VM.
    terminalProxyWebSocket: wss://terminal.{{BASE_DOMAIN}}:{{INGRESS_HOST_PORT}}/terminal

gateway:
  # One replica: this is a single-node VM, so a second buys no failover — it
  # only competes for the same CPU and memory. Production installs keep the
  # chart default, where leader election and spare capacity are real.
  replicaCount: 1
  gateway:
    oidcIssuerUrl: https://mockauth.dev/r/301ebb13-15a8-48f4-baac-e3fa25be29fc/oidc
    oidcClientId: client_MU95KU3gHQf5Ir7p
    oidcAudience: ""
    # Build-time bootstrap token, used by the apps-provision Job while the
    # image is built, and replaced on first boot by one the host generates for
    # that install (scripts/set-bootstrap-token.sh) — a token baked into the
    # image is identical on every machine running that version and cannot be
    # rotated. The identity UUID matches bootstrap's cluster_admin_identity_id
    # constant; the matching OpenFGA admin tuple is written by apps-provision.
    #
    # A literal, not a secretKeyRef: the gateway chart renders CLUSTER_ADMIN_TOKEN
    # only from this value, so the host rewrites the Deployment env instead.
    # Leaving it empty is not an option — the gateway refuses to start when
    # CLUSTER_ADMIN_IDENTITY_ID is set without a token.
    clusterAdminToken: agyn-local-cluster-admin-token
    clusterAdminIdentityId: a3c1e9d2-7f4b-5e1a-9c3d-2b8f6a4e7d10
  # Agents dial the gateway over the OpenZiti overlay (gateway.ziti:443), so the
  # gateway must accept Ziti connections. Without it the overlay dial is reset:
  # "error reading server preface: ... connection reset by peer".
  # extraEnvVars is additive; `env` would replace the chart's templated list.
  extraEnvVars:
    - name: ZITI_ENABLED
      value: "true"

# OpenZiti must be switched on explicitly — ZITI_ENABLED defaults to false in
# these charts, and bootstrap (stacks/platform) sets it to "true". Without it
# the orchestrator builds no ziti-management client, so createIdentity()
# returns nil silently: agent workloads get no OpenZiti identity and no tunnel
# sidecar, then die with "name resolver error: produced zero addresses" trying
# to reach gateway.ziti.
#
# NOTE: `env` REPLACES a subchart's default list (documented in the umbrella
# chart's own values.yaml), and the umbrella already replaces the
# agents-orchestrator list with three entries — dropping every Ziti/agent
# address the subchart shipped. The full list is restored here.
agents-orchestrator:
  # One replica: this is a single-node VM, so a second buys no failover — it
  # only competes for the same CPU and memory. Production installs keep the
  # chart default, where leader election and spare capacity are real.
  replicaCount: 1
  env:
    - name: THREADS_ADDRESS
      value: "threads:50051"
    - name: NOTIFICATIONS_ADDRESS
      value: "notifications:50051"
    - name: AGENTS_ADDRESS
      value: "agents:50051"
    - name: SECRETS_ADDRESS
      value: "secrets:50051"
    - name: RUNNERS_ADDRESS
      value: "runners:50051"
    - name: METERING_SERVICE_ADDRESS
      value: "metering:50051"
    - name: METERING_SAMPLE_INTERVAL
      value: "60s"
    - name: ZITI_ENABLED
      value: "true"
    # The tunnel sidecar every agent workload gets. Unset, the orchestrator
    # falls back to openziti/ziti-tunnel:1.6.15 in code, which is two majors
    # behind the controller (3.2.0-pre6) and router (3.0.0-pre5) this image
    # installs. Bootstrap pins the same tag; prepull-and-wait.sh bakes it into
    # the containerd store, since no agent workload runs during the build.
    - name: ZITI_SIDECAR_IMAGE
      value: "openziti/ziti-tunnel:2.0.0-pre8"
    - name: ZITI_LEASE_RENEWAL_INTERVAL
      value: "2m"
    - name: ZITI_ENROLLMENT_TIMEOUT
      value: "2m"
    - name: ZITI_MANAGEMENT_ADDRESS
      value: "ziti-management:50051"
    - name: AGENT_GATEWAY_ADDRESS
      value: "gateway.ziti:443"
    - name: AGENT_TRACING_ADDRESS
      value: "tracing.ziti:443"
    - name: AGENT_LLM_BASE_URL
      value: "http://llm-proxy.ziti/v1"
    - name: ZITI_ENROLLMENT_CONTROLLER_RESOLVE_HOST
      value: "ziti-controller-client.ziti.svc.cluster.local"
    - name: ZITI_ENROLLMENT_CONTROLLER_PORT
      value: "{{INGRESS_PORT}}"
    - name: ZITI_RUNTIME_CONTROLLER_RESOLVE_HOST
      value: "ziti-controller-client.ziti.svc.cluster.local"
    - name: ZITI_RUNTIME_CONTROLLER_PORT
      value: "{{INGRESS_PORT}}"
    - name: POLL_INTERVAL
      value: "5s"
    - name: IDLE_TIMEOUT
      value: "30s"
    - name: EGRESS_CA_NAMESPACE
      value: "platform"
    - name: GROUP_SYNC_ENABLED
      value: "true"
    - name: GROUPS_ADDRESS
      value: "groups:50051"
    - name: NATS_URL
      value: "nats://nats:4222"
    # The catalog path. IMAGE_PROXY_HOST carries no port: install-ingress.sh
    # mirrors this hostname to the ingress NodePort, so a reference baked here
    # is the same reference production pulls on 443.
    # The umbrella pins the two platform init images; the overlay replaces this
    # env block wholesale, so they have to be repeated here or they render to
    # nothing and every workload falls back to a single init container.
    - name: AGYND_CLI_INIT_IMAGE
      value: "ghcr.io/agynio/agynd-cli-init:0.14.37"
    - name: AGYN_CLI_INIT_IMAGE
      value: "ghcr.io/agynio/agyn-cli-init:0.3.0"
    - name: IMAGES_ADDRESS
      value: "images:50051"
    - name: ORGANIZATIONS_ADDRESS
      value: "organizations:50051"
    - name: IMAGE_PROXY_ADDRESS
      value: "image-proxy:50051"
    - name: IMAGE_PROXY_HOST
      value: "registry.agyn.dev"

# Shell access to sandboxes. The CLI connects from the host, so the WebSocket
# URL it is handed carries the forwarded host port, not the in-cluster one
# (set-ingress-port.sh rewrites it when the host picks a different port).
terminal-proxy:
  enabled: true
  # One replica: this is a single-node VM, so a second buys no failover — it
  # only competes for the same CPU and memory. Production installs keep the
  # chart default, where leader election and spare capacity are real.
  replicaCount: 1
  terminalProxy:
    # Repeats platform.externalUrls.terminalProxyWebSocket above. The umbrella
    # defaults this from a YAML anchor, and anchors resolve when the chart's own
    # values are parsed — an override here does not flow into it. The chart
    # fails the render if the two disagree, which is what keeps the URL the
    # Gateway advertises and the one this service serves in step.
    websocketUrl: wss://terminal.{{BASE_DOMAIN}}:{{INGRESS_HOST_PORT}}/terminal
    # The overlay is the only path that reaches a runner in another network,
    # which is what runners generally are. Keeping the VM on it means the path
    # this ships with is the path that gets exercised, rather than a direct
    # dial that happens to work only because this VM's single runner is local.
    # The identity is requested per pod from Ziti Management and lease-renewed,
    # per openziti.md#service-identity-self-enrollment.
    ziti:
      enabled: true

# llm-proxy exposes a proper toggle rather than a raw env entry.
llm-proxy:
  # One replica: this is a single-node VM, so a second buys no failover — it
  # only competes for the same CPU and memory. Production installs keep the
  # chart default, where leader election and spare capacity are real.
  replicaCount: 1
  llmProxy:
    zitiEnabled: true

# Agents send spans to tracing.ziti:443 over the overlay.
tracing:
  replicaCount: 1
  extraEnvVars:
    - name: ZITI_ENABLED
      value: "true"

console-app:
  replicaCount: 1
  oidcAuthority: https://mockauth.dev/r/301ebb13-15a8-48f4-baac-e3fa25be29fc/oidc
  oidcClientId: client_4XUh4_1VfUzpfYkN
  oidcResource: ""

chat-app:
  replicaCount: 1
  oidcAuthority: https://mockauth.dev/r/301ebb13-15a8-48f4-baac-e3fa25be29fc/oidc
  oidcClientId: client_MU95KU3gHQf5Ir7p
  oidcResource: ""
  origin: https://chat.{{BASE_DOMAIN}}:{{INGRESS_HOST_PORT}}
  mediaProxyUrl: https://media.{{BASE_DOMAIN}}:{{INGRESS_HOST_PORT}}

tracing-app:
  replicaCount: 1
  oidcAuthority: https://mockauth.dev/r/301ebb13-15a8-48f4-baac-e3fa25be29fc/oidc
  oidcClientId: client_tzqVFAYTvpkfUzy5
  oidcResource: ""

media-proxy:
  replicaCount: 1
  mediaProxy:
    oidcIssuerUrl: https://mockauth.dev/r/301ebb13-15a8-48f4-baac-e3fa25be29fc/oidc
    oidcClientId: client_MU95KU3gHQf5Ir7p
    oidcAudience: ""
    corsAllowedOrigin: https://chat.{{BASE_DOMAIN}}:{{INGRESS_HOST_PORT}}

# Event bus.
nats:
  enabled: true

# bitnami redis: pin by digest (the chart defaults to tag "latest"; bitnami no
# longer publishes versioned free tags) and disable auth (NOAUTH errors
# otherwise). NOTE: these two used to live in separate blocks and the second
# silently overrode the first — keep them merged.
notifications-redis:
  # Read replicas buy nothing on one node; the primary still serves.
  replica:
    replicaCount: 1
  image:
    digest: sha256:341edafd5622a1e47e4b3ab379913de84ea4a50d534f40aaa903a3825e0e1cf1
  auth:
    enabled: false

authorization:
  replicaCount: 1
  # authorization's migration Job provisions the OpenFGA store/model and
  # writes their IDs into the authorization-openfga secret.
  openfgaApiUrl: http://openfga.openfga.svc.cluster.local:8080

files:
  replicaCount: 1
  securityContext:
    runAsUser: 65532
    runAsGroup: 65532
  files:
    s3:
      endpoint: minio.minio.svc.cluster.local:9000
      bucket: agyn-files
      region: us-east-1
      useSSL: false

# OpenZiti-backed services. ziti-management self-enrolls with the JWT from the
# ziti-management-enrollment secret (ziti-provision Job); runners/orchestrator/
# gateway then self-enroll via ziti-management.
# The image tag override this used to carry is gone: it named 0.10.17, and the
# umbrella now pins 0.10.19, so the override held the image behind its chart.
# terminal-proxy asks for the Terminal Proxy service type, which 0.10.17 does
# not know, and exits on startup with "unknown service type 8".
ziti-management:
  replicaCount: 1
  zitiControllerUrl: https://ziti-mgmt.{{BASE_DOMAIN}}:{{INGRESS_PORT}}/edge/management/v1

egress:
  enabled: true
  image:
    tag: 0.1.3

# --- Remaining service toggles -------------------------------------
# On. It mounts an *enrolled* OpenZiti identity rather than enrolling itself, so
# the ziti-provision Job enrols one for it (egress-gateway-ziti-identity) — a
# pod cannot consume its own one-time token.
egress-gateway:
  enabled: true
# groups is a core dependency: users/apps/agents do group-sync against it, and
# without it create-user/agent block ~30s on a downstream timeout. Needs its
# database (shared Postgres + db-urls secret) and an arm64 image (upstream only
# publishes amd64 — see the multi-arch note in the README).
groups:
  replicaCount: 1
  enabled: true
  # The subchart's appVersion resolves to 0.1.0, which was published amd64-only
  # and leaves every arm64 pod in ImagePullBackOff. 0.1.1 is the first tag built
  # for both architectures (agynio/groups#8); drop this once the subchart's
  # appVersion catches up.
  image:
    tag: 0.1.1
# The Gateway serves the Networks API unconditionally, so leaving this off
# does not hide the feature — it makes every ListNetworks call fail with
# "produced zero addresses" once the console asks for it. ListServicesByTag,
# the API this needs, ships in the pinned ziti-management.
networks:
  replicaCount: 1
  enabled: true
  # Pinned because the umbrella's vendored networks chart still carries
  # appVersion 0.1.0, and that image is a single amd64 manifest — on this arm64
  # VM the pod dies with `exec format error`. 0.1.1 is the first multi-arch
  # build. Drop this once the umbrella bumps the chart it vendors.
  image:
    tag: "0.1.2"
# On, like every other platform service the Gateway routes to. Its database is
# already provisioned in the shared Postgres and named in the db-urls secret.
expose:
  replicaCount: 1
  enabled: true
ncps:
  enabled: false
registryMirror:
  enabled: false

agents:
  replicaCount: 1

