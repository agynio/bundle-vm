fullnameOverride: minio
mode: standalone
replicas: 1
rootUser: minioadmin
rootPassword: minioadmin
image:
  repository: quay.io/minio/minio
  tag: RELEASE.2024-11-07T00-52-20Z
  pullPolicy: IfNotPresent
persistence:
  enabled: true
  size: 10Gi
resources:
  requests:
    memory: 256Mi
# The files service does not create its bucket -- S3_BUCKET must already exist,
# and without it every upload fails with "The specified bucket does not exist".
# Bootstrap created it with a minio_s3_bucket Terraform resource; the chart can
# do it directly, so nothing else has to.
buckets:
  - name: agyn-files
    policy: none
    purge: false
users: []
policies: []
customCommands: []
svcaccts: []
