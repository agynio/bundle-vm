# agyn-apps umbrella: the k8s-runner and the first-party apps.
#
# Both apps need three things the bundle provisions for them: a database
# (30-postgres.yaml, agyn-app-database-urls), a service token they cannot mint
# for themselves (apps-provision registers them and stores it), and an enrolled
# OpenZiti identity (ziti-provision). With those in place there is no reason for
# an install to ship without them.
#
# The env list replaces the chart default wholesale (subchart env override
# semantics), so every entry must be re-declared — the only actual change is
# GATEWAY_ADDRESS: the platform umbrella sets fullnameOverride "gateway", not
# the chart-default "gateway-gateway".
apps:
  reminders:
    enabled: true
  telegramConnector:
    enabled: true

# Both apps dial the Gateway by name, and the chart defaults to its own
# "gateway-gateway" — the platform umbrella sets fullnameOverride "gateway", so
# the default resolves to nothing and both crashloop on startup. A subchart env
# override replaces the list wholesale, so every entry is re-declared here.
reminders:
  env:
    - name: HTTP_ADDRESS
      value: ":8080"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: agyn-app-database-urls
          key: reminders
    - name: ZITI_IDENTITY_FILE
      value: /ziti/identity.json
    - name: ZITI_SERVICE_NAME
      value: app-reminders
    - name: GATEWAY_SERVICE_NAME
      value: gateway
    - name: GATEWAY_URL
      value: http://gateway.platform.svc.cluster.local:8080
    - name: SERVICE_TOKEN
      valueFrom:
        secretKeyRef:
          name: reminders-service-token
          key: token

telegram-connector:
  env:
    - name: HTTP_ADDRESS
      value: ":8080"
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: agyn-app-database-urls
          key: telegram-connector
    - name: ZITI_IDENTITY_FILE
      value: /ziti/identity.json
    - name: SERVICE_TOKEN
      valueFrom:
        secretKeyRef:
          name: telegram-connector-service-token
          key: token
    - name: GATEWAY_URL
      value: http://gateway.platform.svc.cluster.local:8080
    - name: ZITI_SERVICE_NAME
      value: app-telegram
    - name: GATEWAY_SERVICE_NAME
      value: gateway
    # The chart ships this empty and the connector refuses to start without it.
    # apps-provision stores the id it got from CreateApp next to the token.
    - name: APP_ID
      valueFrom:
        secretKeyRef:
          name: telegram-connector-service-token
          key: app_id
    - name: TELEGRAM_BASE_URL
      value: https://api.telegram.org
    - name: TELEGRAM_POLL_TIMEOUT
      value: "25s"

runners:
  k8s:
    enabled: true

k8s-runner:
  # Tests and platform services dial the bare "k8s-runner" service name
  # (bootstrap parity).
  fullnameOverride: k8s-runner
  # The workload egress policy excludes every private range, so the overlay has
  # to be allowed back in by hand or nothing a workload needs is reachable: the
  # sidecar cannot reach the controller and no agent starts.
  #
  # These are the ziti pods' own ports, not their Services'. A NetworkPolicy is
  # evaluated after the Service DNAT, so 2496 -- the port both Services publish
  # -- never matches; the controller answers on 1280 and the router on 3022.
  workloadEgressNetworkPolicy:
    zitiUnderlay:
      endpoints:
        - name: ziti-controller-client
          namespaceSelector:
            kubernetes.io/metadata.name: ziti
          port: 1280
        - name: ziti-router-edge
          namespaceSelector:
            kubernetes.io/metadata.name: ziti
          port: 3022
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # Setting env here replaces the subchart's default list, which includes
  # CATALOG_PATH — so it must be re-declared or the runner starts with no
  # catalog. It fails quietly: LoadCatalog treats an unset path as "no catalog"
  # rather than an error, the runner reports zero flavors, and creating an
  # environment ends in "This runner reports no flavors".
  env:
    - name: GRPC_ADDR
      value: 0.0.0.0:50051
    - name: CATALOG_PATH
      value: /etc/agyn/runner-catalog/catalog.yaml
    - name: KUBE_NAMESPACE
      value: agyn-workloads
    - name: PVC_STORAGE_SIZE
      value: 10Gi
    - name: ZITI_ENABLED
      value: "true"
    - name: GATEWAY_ADDRESS
      value: gateway.platform.svc.cluster.local:8080
    - name: CAPABILITY_IMPLEMENTATIONS
      value: '{"docker":"rootless"}'
    - name: SERVICE_TOKEN
      valueFrom:
        secretKeyRef:
          name: k8s-runner-service-token
          key: token
    - name: ZITI_ENROLLMENT_TIMEOUT
      value: 2m
    - name: LOG_LEVEL
      value: info
