name: Release

# Builds and publishes the platform VM image.
#
# amd64 builds here. arm64 does not: GitHub offers no arm64 runner with nested
# virtualization, and without KVM the bake takes hours. Until such a runner
# exists, arm64 is released from a maintainer's machine with the same script
# this workflow runs — see `scripts/release.sh` and the README.
#
# Because a release is only complete when both architectures are published, the
# job summary states plainly that arm64 is still owed.

# Never on pull_request: a release publishes, and a PR is not a release.
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.0)"
        required: true
      latest:
        description: "Point the CDN's latest.json at this version"
        type: boolean
        default: false
      publish:
        description: "Publish to GHCR and the CDN"
        type: boolean
        default: true
      cdn_only_arch:
        description: "Skip the build; copy this arch from GHCR to the CDN (amd64 | arm64)"
        required: false
        default: ""

concurrency:
  # Two releases writing the same version to the CDN would interleave uploads.
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  amd64:
    if: ${{ github.event.inputs.cdn_only_arch == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Three ways in, three kinds of version:
      #   tag v0.2.0   -> 0.2.0, and `latest` moves to it
      #   push to main -> sha-<commit>, published but never `latest`
      #   dispatch     -> whatever was typed, `latest` only if asked
      # Only a tag is a release users are pointed at; main builds exist so the
      # image is known to still build, and so a specific commit can be tried.
      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
            latest="${{ github.event.inputs.latest }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Tags are v-prefixed; published versions are not.
            version="${GITHUB_REF_NAME#v}"
            latest=true
          else
            version="sha-$(git rev-parse --short HEAD)"
            latest=false
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version} (latest=${latest})"

      # A hosted runner has ~14 GB free on /, and this build needs well over 20.
      # These toolchains are preinstalled for other people's jobs and unused here.
      - name: Free disk space
        run: |
          before=$(df -BG --output=avail / | awk 'NR==2{gsub("G","");print $1}')
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          after=$(df -BG --output=avail / | awk 'NR==2{gsub("G","");print $1}')
          echo "free disk: ${before}G -> ${after}G"

      # The bake boots a VM inside this runner. Assert acceleration up front:
      # without it QEMU emulates and the job would burn its timeout instead of
      # failing with a reason.
      - name: Verify KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is missing on this runner; the image cannot be built at usable speed"
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          egrep -c '(vmx|svm)' /proc/cpuinfo

      - name: Install build tools
        run: |
          sudo apt-get update
          # xorriso builds the cloud-init CD Packer attaches through cd_files;
          # without it the build errors before it starts a VM, with "could not
          # find a supported CD ISO creation command".
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils xz-utils xorriso
          # Packer, oras and s5cmd are not in the Ubuntu archive.
          curl -fsSL https://apt.releases.hashicorp.com/gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/hashicorp.list >/dev/null
          sudo apt-get update && sudo apt-get install -y packer
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin oras
          curl -fsSL "https://github.com/peak/s5cmd/releases/download/v2.2.2/s5cmd_2.2.2_Linux-64bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin s5cmd
          packer version && oras version && s5cmd version

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Release amd64
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          args=(amd64 "${{ steps.version.outputs.version }}")
          [ "${{ github.event.inputs.publish }}" = "false" ] && args+=(--no-publish)
          [ "${{ steps.version.outputs.latest }}" = "true" ] && args+=(--latest)
          scripts/release.sh "${args[@]}"

      # Keep the build log and metadata even when the disk itself is too large
      # to attach — enough to tell what a failed or surprising build produced.
      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amd64-metadata
          path: |
            artifacts/amd64/metadata.json
            artifacts/amd64/checksums.sha256
            artifacts/amd64/lima.yaml
          if-no-files-found: warn

      - name: Summary
        if: success()
        run: |
          {
            echo "### Released amd64 ${{ steps.version.outputs.version }}"
            echo
            cat artifacts/amd64/checksums.sha256
            echo
            # Only a tag is a release anyone is pointed at, so only a tag is
            # incomplete without its other architecture.
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "**arm64 is not built by CI** — no GitHub runner offers nested"
              echo "virtualization on arm64, so this release is not complete until"
              echo "it is built from a maintainer machine:"
              echo
              echo '```bash'
              echo "scripts/release.sh arm64 ${{ steps.version.outputs.version }} --latest"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Copies an already-published GHCR artifact to the CDN.
  #
  # arm64 is baked on a maintainer's machine, because no GitHub runner offers
  # nested virtualization on arm64 -- but only the *bake* needs that. The upload
  # does not, and doing it here means the R2 credentials never leave GitHub.
  # Push to GHCR from the laptop (`scripts/publish.sh arm64 VERSION`), then run
  # this with cdn_only_arch=arm64.
  publish-cdn:
    if: ${{ github.event.inputs.cdn_only_arch != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install oras and s5cmd
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin oras
          curl -fsSL "https://github.com/peak/s5cmd/releases/download/v2.2.2/s5cmd_2.2.2_Linux-64bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin s5cmd
          oras version && s5cmd version

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      # publish-cdn.sh reads artifacts/<arch>, which is exactly what was pushed.
      - name: Pull the artifact from GHCR
        env:
          ARCH: ${{ github.event.inputs.cdn_only_arch }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          case "${ARCH}" in
          amd64 | arm64) ;;
          *) echo "::error::cdn_only_arch must be amd64 or arm64, got ${ARCH}"; exit 1 ;;
          esac
          mkdir -p "artifacts/${ARCH}"
          oras pull "ghcr.io/agynio/bundle-vm:${VERSION}-${ARCH}" --output "artifacts/${ARCH}"
          ls -lh "artifacts/${ARCH}"

      - name: Publish to the CDN
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
        run: |
          set -euo pipefail
          args=("${{ github.event.inputs.cdn_only_arch }}" "${{ github.event.inputs.version }}")
          [ "${{ github.event.inputs.latest }}" = "true" ] && args+=(--latest)
          scripts/publish-cdn.sh "${args[@]}"
